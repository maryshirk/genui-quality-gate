default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run --locked ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --locked trailing-whitespace-fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --locked end-of-file-fixer
        language: system
        types: [text]
      - id: check-yaml
        name: validate YAML
        entry: uv run --locked check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: validate TOML
        entry: uv run --locked check-toml
        language: system
        types: [toml]
      - id: check-merge-conflict
        name: check merge conflicts
        entry: uv run --locked check-merge-conflict
        language: system
        types: [text]
      - id: check-added-large-files
        name: prevent large files
        entry: uv run --locked check-added-large-files --maxkb=500
        language: system
      - id: detect-private-key
        name: detect private keys
        entry: uv run --locked detect-private-key
        language: system
        types: [text]
      - id: mixed-line-ending
        name: normalize line endings
        entry: uv run --locked mixed-line-ending --fix=lf
        language: system
        types: [text]
      - id: conventional-commit
        name: Conventional Commit subject
        entry: uv run --locked python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
