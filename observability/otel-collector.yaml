receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 140
    spike_limit_mib: 30
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024
exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
    timeout: 2s
    sending_queue:
      queue_size: 32
    retry_on_failure:
      initial_interval: 1s
      max_interval: 3s
      max_elapsed_time: 10s
  otlphttp/victoria:
    metrics_endpoint: http://victoria-metrics:8428/opentelemetry/v1/metrics
    timeout: 2s
    sending_queue:
      queue_size: 32
    retry_on_failure:
      initial_interval: 1s
      max_interval: 3s
      max_elapsed_time: 10s
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/victoria]
