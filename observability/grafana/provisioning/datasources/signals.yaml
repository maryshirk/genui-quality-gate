apiVersion: 1
datasources:
  - name: VictoriaMetrics
    uid: metrics
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    jsonData:
      timeInterval: 5s
  - name: Loki
    uid: logs
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: Trace
          matcherRegex: '"trace_id":\s*"([a-f0-9]{32})"'
          datasourceUid: traces
          url: '$${__value.raw}'
  - name: Tempo
    uid: traces
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: logs
        spanStartTimeShift: '-2m'
        spanEndTimeShift: '2m'
        customQuery: true
        query: '{service=~"api|source|worker"} | json | trace_id="$${__trace.traceId}"'
