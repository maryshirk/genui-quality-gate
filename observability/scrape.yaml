global:
  scrape_interval: 5s
scrape_configs:
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: [rabbitmq:15692]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: rabbitmq_detailed_queue_messages_(ready|unacked)
        action: keep
