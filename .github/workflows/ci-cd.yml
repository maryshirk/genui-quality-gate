name: CI and publish

on:
  pull_request:
  push:
    branches: [main, feat/project-bootstrap, feat/mlflow-pipeline]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quality:
    name: Lint, types, tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: genui
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: genui
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U genui -d genui"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://genui:ci-test-password@127.0.0.1:5432/genui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.24'
          enable-cache: true
      - run: uv sync --locked --group ml
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked --group ml mypy
      - run: uv run --locked pre-commit run --all-files
      - run: uv run --locked --group ml pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  container:
    name: Build once and test Compose
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-test-password
      MLFLOW_POSTGRES_PASSWORD: ci-mlflow-password
      MLFLOW_TRACKING_URI: http://127.0.0.1:5001
      GENUI_MODEL_ENABLED: 'true'
      GENUI_MODEL_NAME: genui-pairwise-quality-smoke
      GENUI_IMAGE: genui-quality-gate:ci
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.24'
          enable-cache: true
      - name: Validate package and release versions
        id: meta
        run: python scripts/image_metadata.py --github-output "$GITHUB_OUTPUT"
      - name: Start MLflow with separate metadata and artifact stores
        run: docker compose up --build --wait --wait-timeout 180 postgres mlflow
      - name: Train synthetic smoke runs and register model versions
        run: uv run --locked --group ml python -m scripts.mlflow_smoke seed
      - name: Build and start application
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: docker compose up --build --wait --wait-timeout 180 app
      - name: Verify endpoints, non-root user, database outage and recovery
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: python scripts/container_smoke.py
      - name: Verify inference, alias switch and startup-only model loading
        run: uv run --locked --group ml python -m scripts.mlflow_smoke verify
      - name: Save tested image
        if: github.event_name == 'push'
        run: docker save "$GENUI_IMAGE" | gzip > tested-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name == 'push'
        with:
          name: tested-image
          path: tested-image.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop test containers
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publish verified image to GHCR
    needs: [quality, container]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/feat/project-bootstrap' ||
       github.ref == 'refs/heads/feat/mlflow-pipeline' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      GENUI_IMAGE: genui-quality-gate:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tested-image
      - name: Load the tested image
        run: gunzip -c tested-image.tar.gz | docker load
      - name: Compute validated image tags
        id: meta
        run: python scripts/image_metadata.py --github-output "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag "$GENUI_IMAGE" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Verify registry content matches the tested image
        env:
          PRIMARY_TAG: ${{ steps.meta.outputs.primary_tag }}
        run: |
          local_id=$(docker image inspect "$GENUI_IMAGE" --format '{{.Id}}')
          docker pull "$PRIMARY_TAG"
          remote_id=$(docker image inspect "$PRIMARY_TAG" --format '{{.Id}}')
          test "$local_id" = "$remote_id"
          docker buildx imagetools inspect "$PRIMARY_TAG" | tee registry-image.txt
          {
            printf '### Published and verified image\n\n'
            printf '`%s`\n\n' "$PRIMARY_TAG"
            printf 'The registry image identity matches the image tested in Compose: `%s`.\n\n' "$local_id"
            printf '```text\n'
            cat registry-image.txt
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
