[project]
name = "genui-quality-gate"
version = "0.1.0"
description = "An asynchronous service for evaluating generated user interfaces"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "maryshirk" }]
dependencies = []

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genui_quality_gate"]

[dependency-groups]
web = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.8,<3",
]
dev = [
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pre-commit>=4.2,<5",
    "pre-commit-hooks>=5,<7",
    "pytest>=8.3,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6,<8",
    "httpx>=0.28,<1",
    "asgi-lifespan>=2.1,<3",
]

[tool.uv]
default-groups = ["web", "dev"]
required-version = "==0.12.24"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = ["integration: requires a real PostgreSQL instance (TEST_DATABASE_URL)"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["genui_quality_gate"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "^\\s*\\.\\.\\.$"]

[tool.coverage.xml]
output = "coverage.xml"
